тся год-два. Добавки, сон и тренировки нужны мне не ради лишних лет, а чтобы у дней хватало сил на главное: на людей, любопытство и тихие моменты.</p><p>Мой любимый такой момент - раннее утро, тишина и небо за окном. Попробуйте зимой «подняться над городом»: перед сном представьте, как поднимаетесь над домом, районом, страной, планетой. С такой высоты многие тревоги теряют срочность.</p><p class=\"q\">Какие три момента этого года вы бы назвали по-настоящему прожитыми? Напишите мне - мне правда интересно.</p>", "people": "<h2>Люди - тоже витамин</h2><p>Зимой мы прячемся по домам, а мозгу нужны люди не меньше, чем свет и магний. В той же книге есть семь «упражнений на общение». Мои любимые на зимние вечера:</p><ul><li><b>Танец без умения.</b> Включить Dancing Queen и танцевать на кухне. Выглядеть глупо - не риск, а смысл.</li><li><b>Оркестр за ужином.</b> Один тихо стучит по столу, другой вилкой по бокалу, третий напевает «на-на-на». Через минуту сердиться уже трудно.</li><li><b>Разговор лёжа.</b> После ужина лечь на пледы, приглушить свет и по очереди продолжить фразу «Больше всего я бы хотела…». Когда не смотришь в глаза, говорить честнее.</li><li><b>Рука другого.</b> С согласия минуту держать руку близкого и рассматривать её: линии, вены, ногти. Эти руки вытирали слёзы, держали руку мамы, что-то строили. Художники давно знали, что руки говорят о человеке больше лица.</li></ul><div class=\"arts\"><figure><img src=\"img/art_adam.webp\" alt=\"Микеланджело, «Сотворение Адама», ок. 1508–1512\" loading=\"lazy\"><figcaption>Микеланджело, «Сотворение Адама», ок. 1508–1512</figcaption></figure><figure><img src=\"img/art_giotto.webp\" alt=\"Джотто, «Не прикасайся ко мне», ок. 1305\" loading=\"lazy\"><figcaption>Джотто, «Не прикасайся ко мне», ок. 1305</figcaption></figure><figure><img src=\"img/art_degas.webp\" alt=\"Эдгар Дега, «Этюд рук», ок. 1860\" loading=\"lazy\"><figcaption>Эдгар Дега, «Этюд рук», ок. 1860</figcaption></figure></div><p class=\"q\">Одна живая встреча в const f=$('gcForm');f.addEventListener('input',()=>{$('gcTo').textContent=f.to.value.trim()||'____';$('gcFrom').textContent=f.from.value.trim()||'____';});
f.addEventListener('submit',ev=>{
  ev.preventDefault();
  const values=Object.fromEntries(['to','from','contact','email'].map(name=>[name,(f.elements.namedItem(name)?.value||'').trim()]));
  values.contact=values.contact||'-';
  const msg=c.msg.replace(/\{(to|from|contact|email)\}/g,(_,name)=>values[name]);
  const url=new URL(c.dm);
  url.searchParams.set('text',msg);
  const ta=$('gcMsg');ta.value=msg;ta.hidden=false;
  $('gcNote').textContent=c.done;
  window.open(url.href,'_blank','noopener');
});
}else{$('giftcard').remove();}
const s=t.shelf;
$('shelf').innerHTML='<h2>'+s.h2+'</h2><p>'+s.intro+'</p><div class="srow">'+s.items.map(i=>'<'+(i.url?'a href="'+esc(i.url)+'" target="_blank" rel="noopener"':'div')+' class="sitem"><img src="img/'+i.img+'" alt="" loading="lazy"><span>'+esc(i.name)+'<small>'+esc(i.note)+'</small></span></'+(i.url?'a':'div')+'>').join('')+'</div>';
['honest','care','beauty','deep','people','cta'].forEach(k=>$(k).innerHTML=t[k]);
$('bookcap').textContent=t.bookcap;$('fine').textContent=t.fine;
</script>
